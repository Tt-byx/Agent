name: CI

# 触发：push/PR 时构建；每天定时构建一次（验证依赖还能编译）
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 3 * * *'  # 每天 UTC 3:00（北京时间 11:00）
  workflow_dispatch:      # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        run: mvn -B -DskipTests package
        working-directory: backend-java

      - name: Run tests
        run: mvn -B test
        working-directory: backend-java
        continue-on-error: true  # 当前测试覆盖不足，失败不阻塞构建

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build Docker image
        run: |
          docker build -t scenic-agent:${{ github.sha }} backend-java
          echo "✅ 镜像构建成功：scenic-agent:${{ github.sha }}"

  # RAG 评测需要运行环境（数据库/Redis/pgvector），在 CI 里起完整服务成本高。
  # 建议部署到测试环境后，通过 API 触发：
  #   curl -X POST https://your-host/api/rag/eval
  eval-note:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Note
        run: |
          echo "RAG 评测需在部署环境触发："
          echo "  curl -X POST https://your-host/api/rag/eval"
          echo "评测集：backend-java/src/main/resources/rag/eval-dataset.tsv"
