# Docker 启动配置
#   Wave 6 建立（2026-10-02）；2026-10-07 改为**全容器化**：MySQL 也进容器，一条命令起全部四个服务。
#
# ─────────────────────────── 怎么用（重要） ───────────────────────────
#
# 日常启动（全容器化，四个服务都在容器里：mysql / pgvector / redis / app）
#       docker compose up -d
#   启动后：
#       应用       http://localhost:10086
#       MySQL      localhost:3307   （容器内 3306；映射到 3307 是为了避开宿主机已有的 MySQL96）
#       PostgreSQL localhost:5432
#       Redis      localhost:6379
#
# 改了后端代码后（重点）
#   代码改动**不会**自动进容器 —— 必须重新打包再重建 app：
#       1) 宿主机打包： cd backend-java && mvn -q -DskipTests package
#       2) 重建 + 重启 app： docker compose up -d --build app
#   之所以是两步：app 用的是 Dockerfile.runtime（单阶段，直接 COPY 宿主机 target/*.jar），
#   构建只要几秒；若改用 Dockerfile（多阶段自包含），容器内 Maven 拉依赖要十几分钟，不适合频繁改代码。
#
# 常用命令
#       docker compose ps                 # 看四个服务状态与健康
#       docker compose logs -f app        # 跟应用日志
#       docker compose restart app        # 重启应用
#       docker compose down               # 停并删容器（数据卷保留，不丢数据）
#       docker compose down -v            # ⚠️ 连数据卷一起删（向量/业务数据全丢，慎用）
#
# ⚠️ 换机器 / 清空重建
#   卷是 compose 自己管理的命名卷（见文件末尾 volumes 段），首次 up 会自动创建。
#   2026-10-07 记录：原来的 pgvector_data 卷曾被 docker prune 删除、71 条向量丢失过一次；
#   重建后已通过重新处理知识库文档恢复，因此这里不再声明 external。

services:
  mysql:
    # 2026-10-07 起改为**默认启动**（全容器化）。
    # 端口映射到 3307：宿主机还留着 Windows 服务 MySQL96 占着 3306。
    # 容器内部仍是标准 3306，应用容器通过服务名 mysql 连接，不受映射影响。
    image: mysql:8.0
    container_name: scenic-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SCENIC_MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: scenic_ai
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 映射到 3307：避免与宿主机 MySQL 抢 3306（容器内部仍是 3306）
      - "3307:3306"
    volumes:
      - scenic-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${SCENIC_MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  pgvector:
    # 知识库向量（scenic_embeddings）、长期记忆（visitor_memory）、语义缓存（semantic_cache）三张表都在这里
    image: pgvector/pgvector:pg17
    container_name: pgvector
    environment:
      POSTGRES_DB: scenic_vectors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCENIC_PG_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      # compose 管理的命名卷；数据持久化在卷里，down 不删、只有 down -v 才清。
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scenic_vectors"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    # 三层记忆（滑窗/摘要）、语义缓存计数、限流、幂等都依赖它
    image: redis:7-alpine
    container_name: scenic-redis
    # 默认不带密码（本机开发够用）。要加密码见文件末尾说明。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - scenic-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    # 2026-10-07 起默认启动（全容器化）。
    # 代价要记住：改后端代码后需要 `docker compose up -d --build app` 重新构建（约 1-2 分钟），
    # 不像在 IDE 里跑那样改完点一下重启就行。
    build:
      context: ./backend-java
      # 运行态 Dockerfile：直接用宿主机 mvn package 产出的 jar，构建只需几秒。
      # 要自包含构建（换机器/CI）就把这里换成 Dockerfile（多阶段版本）。
      dockerfile: Dockerfile.runtime
    container_name: scenic-app
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 密钥统一从项目根目录 .env 注入（该文件已被 gitignore，不会进仓库）。
    # environment 的优先级高于 env_file：.env 里写的是宿主机地址（localhost），
    # 容器里必须换成服务名，所以下面显式覆盖。
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SCENIC_MYSQL_HOST: mysql
      SCENIC_PG_HOST: pgvector
      SCENIC_PG_PORT: "5432"
      # Redis 在 application.yml 里没有配置项（宿主机开发走 Spring Boot 默认的 localhost:6379），
      # 容器里必须用标准环境变量指向服务名，否则会去连容器自己的 6379 而失败。
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SCENIC_MYSQL_PASSWORD: ${SCENIC_MYSQL_PASSWORD:-123456}
      SCENIC_PG_PASSWORD: ${SCENIC_PG_PASSWORD:-postgres}
      # 知识库原始文档的容器内挂载点（对应 application.yml 的 scenic.upload.dir）
      SCENIC_UPLOAD_DIR: /data/scenic_uploads
    volumes:
      # 把宿主机的知识库原始文档挂进容器，便于重建索引
      - D:/scenic_uploads:/data/scenic_uploads
    ports:
      - "10086:10086"

volumes:
  # 2026-10-07：原有的 pgvector_data 卷随 docker prune 一起被删掉了（向量数据已丢，
  # 改为启动后重新导入），所以不再声明 external，交给 compose 正常创建与管理。
  pgvector_data:
  scenic-redis-data:
  scenic-mysql-data:

# ─────────────── 如果以后想给 Redis 加密码 ───────────────
#   1. 改本文件 redis 段：
#        command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SCENIC_REDIS_PASSWORD}"]
#   2. 在 backend-java/src/main/resources/application.yml 里加：
#        spring:
#          data:
#            redis:
#              password: ${SCENIC_REDIS_PASSWORD:}
#   3. 根目录 .env 里加一行 SCENIC_REDIS_PASSWORD=你的密码
#   4. docker compose up -d redis（重建后生效；Redis 里是缓存类数据，丢了会自行重建）
#   IDE 连接时：密码填这个值，用户名留空。
