server:
  port: 10086
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  # 本地私有配置（密钥等），不进版本库；文件不存在也不影响启动
  config:
    import:
      # 密钥与本地私有配置统一放项目根目录 .env（已被 gitignore）。
      # 两个相对路径都试，兼容 `mvn spring-boot:run`（cwd=backend-java）与从仓库根启动
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/scenic_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Python 后端地址（P2 后对话链路已不再依赖它；知识库处理与健康检查随 P3 迁移后移除）
python:
  backend:
    url: http://localhost:9000

# 大模型配置（OpenAI 兼容：DeepSeek / MiMo / 百炼 均可直接替换 base-url 与 model）
# 注意：密钥不要写在本文件（仓库公开）。放项目根目录 .env 或设环境变量。
llm:
  base-url: ${SCENIC_LLM_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${SCENIC_LLM_API_KEY:}
  chat-model: ${SCENIC_LLM_MODEL:deepseek-flash}
  temperature: 0.7
  # deepseek-flash 会先输出推理 token（实测一次问答中推理占 85%）。
  # max-tokens 给小了会导致推理吃光额度、正式回答为空，故必须给足。
  max-tokens: 4096
  timeout-seconds: 120
  max-retries: 2

# Embedding（OpenAI 兼容，当前接硅基流动 bge-m3，输出维度 1024）
embedding:
  base-url: ${SCENIC_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${SCENIC_EMBEDDING_API_KEY:}
  model-name: ${SCENIC_EMBEDDING_MODEL:BAAI/bge-m3}
  dimension: 1024
  timeout-seconds: 30
  max-retries: 2

# 向量库：PostgreSQL + pgvector（P3 起用于知识库检索）
pgvector:
  host: ${SCENIC_PG_HOST:localhost}
  port: ${SCENIC_PG_PORT:5432}
  database: ${SCENIC_PG_DATABASE:scenic_vectors}
  user: ${SCENIC_PG_USER:postgres}
  password: ${SCENIC_PG_PASSWORD:postgres}
  table: scenic_embeddings
  dimension: 1024
  create-table: true

# RAG 检索参数（数值对齐 Python 侧实现）
rag:
  top-k: 5
  chunk-size: 400
  chunk-overlap: 50
  max-context-chars: 1500
  # 阈值语义与 Python 侧相反：ChromaDB 用 cosine distance（0.7 为上限，越小越相关），
  # LangChain4j 返回 similarity score（越大越相关），所以这里是下限。
  min-score: 0.3
  max-chunks-per-doc: 2000
  # 混合检索每路取的候选池大小（融合后取 top-k）
  pool-size: 20
  # 对话链路使用的检索模式：vector / hybrid / hybrid+rerank
  mode: hybrid+rerank

# Rerank（硅基流动 bge-reranker-v2-m3）。未配置 key 时自动跳过重排，不影响可用性。
rerank:
  enabled: ${SCENIC_RERANK_ENABLED:true}
  base-url: ${SCENIC_RERANK_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${SCENIC_RERANK_API_KEY:${SCENIC_EMBEDDING_API_KEY:}}
  model-name: ${SCENIC_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
  timeout-seconds: 30

# WebSocket 配置
websocket:
  max-text-message-size: 65536
  max-binary-message-size: 10485760

# 日志
logging:
  level:
    com.scenic.ai: debug

# 文件上传目录
scenic:
  upload:
    dir: D:/scenic_uploads
