server:
  port: 10086
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  # Wave 4 · Tomcat 线程池显式配置（原先全为默认值，无法按容量规划调整）
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192

spring:
  # 本地私有配置（密钥等），不进版本库；文件不存在也不影响启动
  config:
    import:
      # 密钥与本地私有配置统一放项目根目录 .env（已被 gitignore）。
      # 两个相对路径都试，兼容 `mvn spring-boot:run`（cwd=backend-java）与从仓库根启动
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # host 用变量以便容器内运行（docker compose 里服务名即主机名）
    url: jdbc:mysql://${SCENIC_MYSQL_HOST:localhost}:3306/scenic_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SCENIC_MYSQL_USERNAME:root}
    # D2 · 密码不硬编码：默认仅为本机演示值，公开仓库前在 .env 里设 SCENIC_MYSQL_PASSWORD
    password: ${SCENIC_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Wave 4 · HikariCP 显式配置（原先全默认：池上限隐式、无生命周期管理）
    hikari:
      pool-name: scenic-mysql
      maximum-pool-size: 10
      minimum-idle: 2
  # 2026-11-03 新增 · Redis 超时。
  # 此前**完全没有这段配置**，用的是 Spring Boot 默认的 60 秒命令超时。
  # 实测停掉 Redis 后，第一个涉及滑窗/限流/幂等的操作要等 53 秒才失败 ——
  # 用户看到的就是「点发送，转圈一分钟」。
  # 注意：一次对话会**串行访问 Redis 七八次**（限流 → 滑窗读 → 缓存查 →
  # 幂等占位 → 滑窗写 → 摘要检查…），所以实际延迟是「超时 × 次数」。
  # 3 秒试过，实测仍要 22 秒；本地 Redis 正常往返是 1~5ms，1 秒已经非常宽松。
  data:
    redis:
      timeout: 1s
      connect-timeout: 1s
      # Lettuce 断线后不要无限重连，避免日志被刷满
      lettuce:
        shutdown-timeout: 100ms
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1740000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Python 后端地址（P2 后对话链路已不再依赖它；知识库处理与健康检查随 P3 迁移后移除）
# （A2 · 2026-09-28）原 python.backend 配置已随 Python 后端退役删除

# 大模型配置（OpenAI 兼容：DeepSeek / MiMo / 百炼 均可直接替换 base-url 与 model）
# 注意：密钥不要写在本文件（仓库公开）。放项目根目录 .env 或设环境变量。
llm:
  base-url: ${SCENIC_LLM_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${SCENIC_LLM_API_KEY:}
  chat-model: ${SCENIC_LLM_MODEL:deepseek-v4-pro}
  temperature: 0.7
  # deepseek-flash 会先输出推理 token（实测一次问答中推理占 85%）。
  # max-tokens 给小了会导致推理吃光额度、正式回答为空，故必须给足。
  max-tokens: 4096
  timeout-seconds: 120
  # Wave 1：关闭 LangChain4j 内置的「无差别重试」，改由 RetryPolicy 按错误类型分级重试
  max-retries: 0
  # Wave 1 · 分级重试：只重试 429/5xx/超时；指数退避 + 全抖动
  retry:
    max-attempts: 3
    base-backoff-ms: 500
    max-backoff-ms: 5000
  # Wave 1 · 熔断：主备各自独立窗口；打开后请求直接跳过该候选，避免故障放大
  circuit-breaker:
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-seconds: 30
    half-open-calls: 2
    # 2026-10-29（D28）· 慢调用也算故障。
    # LLM 最典型的故障不是报错而是「变慢」：状态码仍是 200，失败率 0%，
    # 只按失败率熔断的话熔断器永远不打开，每个用户都白等。
    # 40s 是有意放宽的：一次长回答 10~20s 属正常，压到 20s 会误熔断；
    # 慢调用率到 80% 才打开，给偶发抖动留余量。
    slow-call-duration-seconds: 40
    slow-call-rate-threshold: 80
  # P8 · 备用模型（同厂商双档降级）：主模型 deepseek-flash 异常时自动切 deepseek-v4-pro。
  # 注意：硅基流动的 key 只用于 embedding 与 rerank，不做对话模型。
  fallback:
    enabled: true
    base-url: ${SCENIC_FALLBACK_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${SCENIC_FALLBACK_API_KEY:${SCENIC_LLM_API_KEY:}}
    model: ${SCENIC_FALLBACK_MODEL:deepseek-v4-pro}

# Embedding（OpenAI 兼容，当前接硅基流动 bge-m3，输出维度 1024）
embedding:
  base-url: ${SCENIC_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${SCENIC_EMBEDDING_API_KEY:}
  model-name: ${SCENIC_EMBEDDING_MODEL:BAAI/bge-m3}
  dimension: 1024
  # 2026-11-03：30s -> 8s。实测停掉 pgvector 后一次问答从 3.8s 涨到 32.75s，
  # 主要就是等这个超时。正常的 embedding 往返是 200~500ms，8 秒已经非常宽松；
  # RAG 是「增强」不是「必需」，挂掉时必须快速降级，而不是让用户干等。
  timeout-seconds: 8
  max-retries: 1

# 向量库：PostgreSQL + pgvector（P3 起用于知识库检索）
pgvector:
  host: ${SCENIC_PG_HOST:localhost}
  port: ${SCENIC_PG_PORT:5432}
  database: ${SCENIC_PG_DATABASE:scenic_vectors}
  user: ${SCENIC_PG_USER:postgres}
  password: ${SCENIC_PG_PASSWORD:postgres}
  table: scenic_embeddings
  dimension: 1024
  create-table: true

# RAG 检索参数（数值对齐 Python 侧实现）
rag:
  top-k: 5
  chunk-size: 400
  chunk-overlap: 50
  max-context-chars: 1500
  # 阈值语义与 Python 侧相反：ChromaDB 用 cosine distance（0.7 为上限，越小越相关），
  # LangChain4j 返回 similarity score（越大越相关），所以这里是下限。
  min-score: 0.3
  max-chunks-per-doc: 2000
  # 混合检索每路取的候选池大小（融合后取 top-k）
  pool-size: 20
  # 对话链路使用的检索模式：vector / hybrid / hybrid+rerank
  mode: hybrid+rerank

# Rerank（硅基流动 bge-reranker-v2-m3）。未配置 key 时自动跳过重排，不影响可用性。
rerank:
  enabled: ${SCENIC_RERANK_ENABLED:true}
  base-url: ${SCENIC_RERANK_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${SCENIC_RERANK_API_KEY:${SCENIC_EMBEDDING_API_KEY:}}
  model-name: ${SCENIC_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
  # 重排是可跳过环节，超时要短：宁可少一层精排，也不要拖慢整轮回答
  timeout-seconds: 5

# MCP Server（P6）：把景区工具以标准 MCP 协议暴露给外部客户端
# 外部客户端（Cherry Studio / Claude Desktop）填 http://<host>:10086/mcp
mcp:
  endpoint: /mcp
  server-name: scenic-mcp-server
  server-version: 1.0.0

# P7 · Agent 循环（ReAct）
agent:
  # 最大执行步数：防止模型反复调工具陷入死循环
  max-steps: 6
  # Wave 1 · 单步工具调用上限（超出部分不执行，以失败文本回灌给模型）
  max-tools-per-step: 4
  # Wave 1 · 单个工具的超时与有限重试
  tool:
    timeout-ms: 15000
    max-attempts: 2
  # 整轮任务的整体超时（秒）
  timeout-seconds: 120
  system-prompt: prompts/scenic-agent-system.txt
  # 故障注入工具开关：仅用于验收「工具失败后 Agent 能自纠或优雅告知」
  debug-tools:
    enabled: false
  # Wave 5 · 流式（SSE）：单次流式对话的整体超时；超时 SseEmitter 自动结束
  stream:
    timeout-ms: 300000
  # P9 · 多 Agent 编排（Supervisor）：开启后对话由调度者委派给专家 Agent
  multi:
    enabled: false

# P8 · 记忆体系
memory:
  short-term:
    # 滑窗保留的最大**轮**数（1 轮 = 用户一条 + 助手一条）。
    # Wave 6 · 修 B3：窗口容量只由它决定（= max-turns × 2 条消息）。
    # 原先还有一个 summarize-threshold 配置，但它先被 clamp 到 max-turns×2、
    # 又赋给了一个从未被读取的字段 —— 是死配置，已移除。
    max-turns: 10
  long-term:
    # 召回用户偏好时取几条
    top-k: 3
    # 相似度下限（越高越严格）
    min-score: 0.55
    # 2026-10-29（D18）· 语义去重阈值：新偏好与已有记忆相似度 ≥ 此值即视为同一条，跳过写入。
    # 用语义而不是字符串：模型每次措辞都不同（「喜欢拍照」/「对摄影有兴趣」）。
    # 调低会误判（把「喜欢爬山」和「不想爬山」当成同一条），所以取 0.95 这种高阈值。
    duplicate-score: 0.95
    # 每人最多保留多少条偏好；超出后按 created_at 淘汰最旧的。
    # 长期记忆表没有 TTL，不设上限就会无限增长（还要为每条付一次 embedding 调用）。
    max-facts-per-visitor: 40

# P8 · 语义缓存：命中后直接返回缓存答案，不再调用模型
cache:
  semantic:
    enabled: true
    # 命中阈值：语义相似度必须高于此值才复用答案
    min-score: 0.92
    # Wave 4 · TTL：超过该时长的缓存不再复用（无时间戳的历史条目按已过期处理）
    ttl-hours: 24
    # Wave 4 · 容量上限：超过后按写入时间淘汰最旧的（近似 LRU），防止缓存表无限增长
    max-entries: 5000

# P8 · 网关
gateway:
  rate-limit:
    enabled: true
    # 每个身份每分钟最多的对话请求数。
    # 维度优先级（见 IdentityResolver）：登录 user:{id} → 游客 visitor:{vid} → 客户端 IP。
    # 注意：**不再使用 body 里的 visitorId** —— 那是客户端自己写的，换个值就是一批新配额。
    per-minute: 20
    # 2026-10-29（D05）· 是否信任 X-Forwarded-For（默认 false）。
    # false：只用 request.getRemoteAddr()，客户端伪造任何头都换不来新配额。
    # 只有部署在可信反向代理之后才置 true；届时取 XFF 的**最后一段**（离服务端最近的一跳），
    # 因为第一段是客户端自己塞进去的，永远可伪造。
    trust-forwarded-for: ${SCENIC_TRUST_FORWARDED_FOR:false}
  # Wave 4 · 幂等：带 requestId 的重复提交只真正执行一次
  idempotency:
    # 首次结果保留多久（期间重复提交直接复用）
    ttl-minutes: 30
    # 「处理中」占位锁的时长；处理失败后锁到期即可重试。
    # 2026-10-29（D17）：60 → 150。依据是「静态 TTL 按最坏情况设，不按平均情况设」：
    # Agent 最坏要跑 agent.timeout-seconds=120s，锁只有 60s 的话，
    # 第 60~120 秒之间第二个重复请求能拿到锁 → 重复跑一遍完整链路，
    # 也就是「幂等保护在最需要它的时候失效」。这里留 30s 余量。
    # 反面是崩溃后最多要等 150s 才能重试，这个代价可以接受。
    lock-seconds: 150

# Wave 4 · 成本台账单价（元 / 千 token）。
# 仅用于「量级估算」，不代表真实账单；接入实际采购价后可直接替换。
ops:
  pricing:
    flash:
      input-per-1k: 0.001
      output-per-1k: 0.002
    pro:
      input-per-1k: 0.004
      output-per-1k: 0.012

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# 2026-10-29（D30）：原来的 websocket.* 配置段已删除。
# 那两个 key（max-text-message-size / max-binary-message-size）从来没有被任何代码读取过 ——
# 它们是死配置：看起来能调，改了没反应，比没有配置更误导。
# WebSocket 链路已整体移除，对话走 /api/chat 与 /api/chat/stream（SSE）。

# 日志
logging:
  level:
    com.scenic.ai: debug
  pattern:
    # Wave 3 · 每行日志带上 traceId（由 TraceIdFilter 写入 MDC）：
    # 一次请求跨 Controller→ChatService→AgentLoop→Toolbox→Model 的日志从此可以串联排查
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# 文件上传目录（容器里指向挂载点 /data/scenic_uploads，宿主机开发用默认路径）
scenic:
  upload:
    dir: ${SCENIC_UPLOAD_DIR:D:/scenic_uploads}
