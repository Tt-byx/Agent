server:
  port: 10086
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  # 本地私有配置（密钥等），不进版本库；文件不存在也不影响启动
  config:
    import:
      # 密钥与本地私有配置统一放项目根目录 .env（已被 gitignore）。
      # 两个相对路径都试，兼容 `mvn spring-boot:run`（cwd=backend-java）与从仓库根启动
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/scenic_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SCENIC_MYSQL_USERNAME:root}
    # D2 · 密码不硬编码：默认仅为本机演示值，公开仓库前在 .env 里设 SCENIC_MYSQL_PASSWORD
    password: ${SCENIC_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Python 后端地址（P2 后对话链路已不再依赖它；知识库处理与健康检查随 P3 迁移后移除）
# （A2 · 2026-09-28）原 python.backend 配置已随 Python 后端退役删除

# 大模型配置（OpenAI 兼容：DeepSeek / MiMo / 百炼 均可直接替换 base-url 与 model）
# 注意：密钥不要写在本文件（仓库公开）。放项目根目录 .env 或设环境变量。
llm:
  base-url: ${SCENIC_LLM_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${SCENIC_LLM_API_KEY:}
  chat-model: ${SCENIC_LLM_MODEL:deepseek-v4-pro}
  temperature: 0.7
  # deepseek-flash 会先输出推理 token（实测一次问答中推理占 85%）。
  # max-tokens 给小了会导致推理吃光额度、正式回答为空，故必须给足。
  max-tokens: 4096
  timeout-seconds: 120
  # Wave 1：关闭 LangChain4j 内置的「无差别重试」，改由 RetryPolicy 按错误类型分级重试
  max-retries: 0
  # Wave 1 · 分级重试：只重试 429/5xx/超时；指数退避 + 全抖动
  retry:
    max-attempts: 3
    base-backoff-ms: 500
    max-backoff-ms: 5000
  # Wave 1 · 熔断：主备各自独立窗口；打开后请求直接跳过该候选，避免故障放大
  circuit-breaker:
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-seconds: 30
    half-open-calls: 2
  # P8 · 备用模型（同厂商双档降级）：主模型 deepseek-flash 异常时自动切 deepseek-v4-pro。
  # 注意：硅基流动的 key 只用于 embedding 与 rerank，不做对话模型。
  fallback:
    enabled: true
    base-url: ${SCENIC_FALLBACK_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${SCENIC_FALLBACK_API_KEY:${SCENIC_LLM_API_KEY:}}
    model: ${SCENIC_FALLBACK_MODEL:deepseek-v4-pro}

# Embedding（OpenAI 兼容，当前接硅基流动 bge-m3，输出维度 1024）
embedding:
  base-url: ${SCENIC_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${SCENIC_EMBEDDING_API_KEY:}
  model-name: ${SCENIC_EMBEDDING_MODEL:BAAI/bge-m3}
  dimension: 1024
  timeout-seconds: 30
  max-retries: 2

# 向量库：PostgreSQL + pgvector（P3 起用于知识库检索）
pgvector:
  host: ${SCENIC_PG_HOST:localhost}
  port: ${SCENIC_PG_PORT:5432}
  database: ${SCENIC_PG_DATABASE:scenic_vectors}
  user: ${SCENIC_PG_USER:postgres}
  password: ${SCENIC_PG_PASSWORD:postgres}
  table: scenic_embeddings
  dimension: 1024
  create-table: true

# RAG 检索参数（数值对齐 Python 侧实现）
rag:
  top-k: 5
  chunk-size: 400
  chunk-overlap: 50
  max-context-chars: 1500
  # 阈值语义与 Python 侧相反：ChromaDB 用 cosine distance（0.7 为上限，越小越相关），
  # LangChain4j 返回 similarity score（越大越相关），所以这里是下限。
  min-score: 0.3
  max-chunks-per-doc: 2000
  # 混合检索每路取的候选池大小（融合后取 top-k）
  pool-size: 20
  # 对话链路使用的检索模式：vector / hybrid / hybrid+rerank
  mode: hybrid+rerank

# Rerank（硅基流动 bge-reranker-v2-m3）。未配置 key 时自动跳过重排，不影响可用性。
rerank:
  enabled: ${SCENIC_RERANK_ENABLED:true}
  base-url: ${SCENIC_RERANK_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${SCENIC_RERANK_API_KEY:${SCENIC_EMBEDDING_API_KEY:}}
  model-name: ${SCENIC_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
  timeout-seconds: 30

# MCP Server（P6）：把景区工具以标准 MCP 协议暴露给外部客户端
# 外部客户端（Cherry Studio / Claude Desktop）填 http://<host>:10086/mcp
mcp:
  endpoint: /mcp
  server-name: scenic-mcp-server
  server-version: 1.0.0

# P7 · Agent 循环（ReAct）
agent:
  # 最大执行步数：防止模型反复调工具陷入死循环
  max-steps: 6
  # Wave 1 · 单步工具调用上限（超出部分不执行，以失败文本回灌给模型）
  max-tools-per-step: 4
  # Wave 1 · 单个工具的超时与有限重试
  tool:
    timeout-ms: 15000
    max-attempts: 2
  # 整轮任务的整体超时（秒）
  timeout-seconds: 120
  system-prompt: prompts/scenic-agent-system.txt
  # 故障注入工具开关：仅用于验收「工具失败后 Agent 能自纠或优雅告知」
  debug-tools:
    enabled: false
  # P9 · 多 Agent 编排（Supervisor）：开启后对话由调度者委派给专家 Agent
  multi:
    enabled: false

# P8 · 记忆体系
memory:
  short-term:
    # 滑窗保留的最大**轮**数（1 轮 = 用户一条 + 助手一条）
    max-turns: 10
    # 累计消息数超过该值时，把最旧的溢出部分摘要化
    summarize-threshold: 16
  long-term:
    # 召回用户偏好时取几条
    top-k: 3
    # 相似度下限（越高越严格）
    min-score: 0.55

# P8 · 语义缓存：命中后直接返回缓存答案，不再调用模型
cache:
  semantic:
    enabled: true
    # 命中阈值：语义相似度必须高于此值才复用答案
    min-score: 0.92

# P8 · 网关
gateway:
  rate-limit:
    enabled: true
    # 每个游客（visitorId/IP）每分钟最多的对话请求数
    per-minute: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# WebSocket 配置
websocket:
  max-text-message-size: 65536
  max-binary-message-size: 10485760

# 日志
logging:
  level:
    com.scenic.ai: debug
  pattern:
    # Wave 3 · 每行日志带上 traceId（由 TraceIdFilter 写入 MDC）：
    # 一次请求跨 Controller→ChatService→AgentLoop→Toolbox→Model 的日志从此可以串联排查
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# 文件上传目录
scenic:
  upload:
    dir: D:/scenic_uploads
